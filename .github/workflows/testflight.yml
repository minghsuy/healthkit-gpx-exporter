name: TestFlight

# Archives the app and uploads it to App Store Connect (TestFlight).
# Never add pull_request or pull_request_target: this job reads signing
# secrets, and those triggers can run fork-controlled code.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One upload at a time. Unlike ci.yml, never cancel in progress: a run killed
# mid-upload can leave a half-processed build in App Store Connect, while a
# queued run just uploads a little later.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-secrets:
    name: Check App Store Connect secrets
    # Job-level `if:` cannot read `secrets`, so this cheap job turns their
    # presence into an output the upload job can gate on. Until the owner adds
    # the secrets (docs/CI.md) the workflow succeeds without uploading.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check secrets are set
        id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "TestFlight upload skipped: secrets not configured — see docs/CI.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  archive-and-upload:
    name: Archive and upload to TestFlight
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    # This repository is PUBLIC: jobs must stay on GitHub-hosted runners. Never
    # route them to the fleet's self-hosted runner (dgx-infra STANDARDS.md §3).
    # The XCODE_APP pin must name a version the macos-26 image still ships.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
      PROJECT: HealthKitGPXExporter/HealthKitGPXExporter.xcodeproj
      SCHEME: HealthKitGPXExporter
      TEAM_ID: VBTBZK4HY6
      # App Store Connect rejects a build number already used for the same
      # MARKETING_VERSION. The project file carries CURRENT_PROJECT_VERSION = 2
      # and builds may have been uploaded by hand, so CI numbers start above
      # them. Raise the offset (never lower it) if a manual upload ever exceeds
      # it. The command-line override applies to every target in the build,
      # which is harmless for an archive.
      BUILD_OFFSET: 100
      RUN_NUMBER: ${{ github.run_number }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      # Automatic signing with the API key: -allowProvisioningUpdates lets
      # xcodebuild create or update the App ID, profiles and certificates, so
      # no certificate or profile is stored as a secret.
      - name: Archive
        run: |
          set -euo pipefail
          build_number=$((BUILD_OFFSET + RUN_NUMBER))
          echo "Build number: $build_number"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HealthKitGPXExporter.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$build_number"

      # destination=upload in ci/ExportOptions.plist sends the build straight
      # to App Store Connect; -exportPath is still required by xcodebuild.
      - name: Export and upload
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HealthKitGPXExporter.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove App Store Connect API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
