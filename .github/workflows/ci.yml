name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Test release preflight
        run: ./scripts/test-release-preflight.sh

      - name: Validate release candidate
        run: ./scripts/release-preflight.sh --candidate

  build-and-test:
    runs-on: macos-26-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Debug and Release without signing
        run: ./scripts/ci-test.sh build

      - name: Run full simulator test suite
        run: ./scripts/ci-test.sh test

      - name: Inspect unsigned Release archive
        run: ./scripts/ci-test.sh archive

      - name: Retain Xcode test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xcode-test-results
          path: ${{ runner.temp }}/healthkit-xcode/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
